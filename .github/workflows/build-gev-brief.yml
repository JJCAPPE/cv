name: Assemble GE Vernova research brief

on:
  push:
    branches:
      - research/gev-outreach-brief
    paths:
      - .github/workflows/build-gev-brief.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: research/gev-outreach-brief
          fetch-depth: 0

      - name: Assemble and validate the brief
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d outreach/gev/.build ]; then
            echo "No staged brief fragments remain; nothing to assemble."
            exit 0
          fi

          cat \
            outreach/gev/.build/part-00.md \
            outreach/gev/.build/part-01.md \
            > outreach/gev/ge-vernova-research-brief.md

          python - <<'PY'
          from pathlib import Path
          import re

          brief = Path("outreach/gev/ge-vernova-research-brief.md").read_text(encoding="utf-8")
          sources = Path("outreach/gev/sources.md").read_text(encoding="utf-8")

          headings = re.findall(r"^## (\d+)\. ", brief, flags=re.MULTILINE)
          expected = [str(index) for index in range(1, 21)]
          assert headings == expected, f"Unexpected numbered headings: {headings}"

          assert brief.count("```") % 2 == 0, "Unbalanced Markdown code fences"
          assert not any(marker in brief for marker in ("TODO", "TBD", "PLACEHOLDER", "R000"))
          assert all(
              label in brief
              for label in (
                  "[Verified fact]",
                  "[Strong inference]",
                  "[Tentative hypothesis]",
                  "[Not publicly knowable]",
              )
          )

          used = set(re.findall(r"\[S(\d{2})\]", brief))
          registered = set(re.findall(r"\*\*S(\d{2})\*\*", sources))
          missing = sorted(used - registered)
          assert not missing, f"Unregistered source keys: {missing}"
          assert len(registered) == 55, f"Expected 55 source records, found {len(registered)}"

          print(f"Validated {len(brief):,} characters across {len(brief.splitlines()):,} lines")
          PY

          rm -rf outreach/gev/.build

      - name: Commit assembled artifact
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- outreach/gev; then
            echo "No artifact changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outreach/gev
          git commit -m "docs: assemble GE Vernova research brief"
          git push
