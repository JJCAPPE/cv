name: Site mobile regression

on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site-mobile.yml"
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/site-mobile.yml"
  workflow_dispatch:

concurrency:
  group: site-mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  webkit-iphone:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Exercise the apex value that predates the canonical www migration.
      NEXT_PUBLIC_SITE_URL: https://giacomocappelletto.com
    defaults:
      run:
        working-directory: site

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install WebKit and system dependencies
        run: npx playwright install --with-deps webkit

      - name: Check types and lint
        run: |
          npx tsc --noEmit
          npm run lint

      - name: Build the production site
        run: npm run build

      - name: Verify production indexing policy
        run: |
          npm start -- --hostname 127.0.0.1 --port 3000 > /tmp/cv-site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:3000/robots.txt > /tmp/robots.txt

          grep -Eq '^Allow:[[:space:]]*/[[:space:]]*$' /tmp/robots.txt

          if grep -Eq '^Disallow:[[:space:]]*/[[:space:]]*$' /tmp/robots.txt; then
            cat /tmp/robots.txt
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/home.html

          if grep -Eqi '<meta[^>]+name="robots"[^>]+content="[^"]*noindex' /tmp/home.html; then
            echo "Production home page unexpectedly contains noindex."
            exit 1
          fi

          npm run seo:check -- http://127.0.0.1:3000

      - name: Crawl every route on iPhone WebKit
        run: MOBILE_PRODUCTION=1 npm run test:mobile

      - name: Upload mobile review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-webkit-evidence
          path: |
            site/mobile-evidence
            site/test-results/mobile
          if-no-files-found: error
          retention-days: 7
